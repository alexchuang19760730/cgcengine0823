name: Build CGC Edge Engine

env:
  TARGET_RELEASE_REPO: powerautoai/ComputeGraphCompiler

on:
  push:
    tags:
      - 'v*' # 當您推播 v1.0.0 這樣的 tag 時會自動觸發
  workflow_dispatch: # 也允許您在 GitHub 網頁上手動點擊執行

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: cgc
            asset_name: cgc-linux-amd64
          - os: macos-latest
            artifact_name: cgc
            asset_name: cgc-darwin-universal
          - os: windows-latest
            artifact_name: cgc.exe
            asset_name: cgc-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 使用穩定的 3.11 進行編譯

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka fastapi uvicorn requests

      - name: Build with Nuitka (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python3 cgc.py build

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python cgc.py build

      - name: Rename Artifact for Release
        run: |
          mv ${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        if: runner.os != 'Windows'

      - name: Rename Artifact for Release (Windows)
        run: |
          ren ${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        if: runner.os == 'Windows'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repository: ${{ env.TARGET_RELEASE_REPO }}
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.ALEXCHUANG }}
