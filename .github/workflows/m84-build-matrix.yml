name: M8.4 Build Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/m84-build-matrix.yml"
      - "Jenkinsfile"
      - "CGC_Release/m8_gate.py"
      - "CGC_Release/m8_gate.yaml"
      - "app/cli/cgc.py"
      - "app/edge_engine/build.py"
      - "scripts/ci/**"

jobs:
  build-platform:
    name: M8.4 Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            python: "3.13"
          - platform: macos
            os: macos-latest
            python: "3.13"
          - platform: linux
            os: ubuntu-latest
            python: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Build Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka fastapi uvicorn requests pyyaml jsonschema

      - name: Run cgc build
        shell: bash
        run: |
          mkdir -p .m84-reports .m84-builds/${{ matrix.platform }}
          python -m app.cli.cgc build \
            --output-dir "${GITHUB_WORKSPACE}/.m84-builds/${{ matrix.platform }}" \
            --json \
            --report-file "${GITHUB_WORKSPACE}/.m84-reports/host-build-${{ matrix.platform }}.json" \
            --aggregate-dir "${GITHUB_WORKSPACE}/.m84-reports"

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m84-build-report-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            .m84-reports/${{ matrix.platform }}.json
            .m84-reports/host-build-${{ matrix.platform }}.json

      - name: Upload Build Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m84-build-output-${{ matrix.platform }}
          if-no-files-found: warn
          path: .m84-builds/${{ matrix.platform }}

  aggregate-m84-gate:
    name: Aggregate M8.4 Matrix Gate
    runs-on: ubuntu-latest
    needs:
      - build-platform
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Gate Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema

      - name: Download Per-Platform Reports
        uses: actions/download-artifact@v4
        with:
          pattern: m84-build-report-*
          path: .m84-matrix
          merge-multiple: true

      - name: Download Per-Platform Build Outputs
        uses: actions/download-artifact@v4
        with:
          pattern: m84-build-output-*
          path: .m84-build-artifacts

      - name: Write build_matrix.json
        shell: bash
        run: |
          python scripts/ci/write_build_matrix.py \
            --input-dir "${GITHUB_WORKSPACE}/.m84-matrix" \
            --required-platform windows \
            --required-platform macos \
            --required-platform linux

      - name: Render M8.4-Only Gate Config
        shell: bash
        run: |
          python scripts/ci/render_m84_gate_config.py \
            --base-config "${GITHUB_WORKSPACE}/CGC_Release/m8_gate.yaml" \
            --output-config "${GITHUB_WORKSPACE}/.m84-matrix/m84-only.yaml" \
            --matrix-dir "${GITHUB_WORKSPACE}/.m84-matrix" \
            --dist-dir "${GITHUB_WORKSPACE}/CGC_Release/dist"

      - name: Collect Release Dist
        shell: bash
        run: |
          python scripts/ci/collect_release_dist.py \
            --matrix-dir "${GITHUB_WORKSPACE}/.m84-matrix" \
            --build-artifacts-dir "${GITHUB_WORKSPACE}/.m84-build-artifacts" \
            --dist-dir "${GITHUB_WORKSPACE}/CGC_Release/dist" \
            --release-assets-dir "${GITHUB_WORKSPACE}/CGC_Release/dist/release_assets" \
            --required-platform windows \
            --required-platform macos \
            --required-platform linux

      - name: Run M8.4 Gate
        shell: bash
        run: |
          python CGC_Release/m8_gate.py \
            --output-dir "${GITHUB_WORKSPACE}/.m84-gate" \
            --config "${GITHUB_WORKSPACE}/.m84-matrix/m84-only.yaml" \
            --print-report

      - name: Upload M8.4 Gate Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m84-gate-report
          if-no-files-found: warn
          path: |
            .m84-matrix
            .m84-build-artifacts
            .m84-gate
            CGC_Release/dist

      - name: Upload M8.4 Dist Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m84-release-dist
          if-no-files-found: warn
          path: |
            CGC_Release/dist

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CGC_Release/dist/build_matrix_manifest.json
            CGC_Release/dist/release_assets/*
