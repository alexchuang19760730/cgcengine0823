// PD Service gRPC Protocol - Prefetch Distribution Service
// KV Cache Management + Prefix Cache + Distributed Block Allocation
//
// Architecture:
//     [Client: vLLM API]
//          ↓ gRPC
//     [PD Service Cluster (Multi-node)]
//          ↓ gRPC + CGC Command
//     [Model Worker (GPU Cluster)]

syntax = "proto3";

package pd;

// ============================================================================
// PD Service: KV Management + Prefix Cache + CGC Command Binding
// ============================================================================
service PDService {
    // Block allocation for KV cache
    rpc AllocateBlocks(BlockRequest) returns (BlockResponse);

    // Prefix KV cache operations
    rpc StorePrefixKV(PrefixKVRequest) returns (PrefixKVResponse);
    rpc GetPrefixKV(PrefixRequest) returns (PrefixResponse);
    rpc InvalidatePrefix(PrefixInvalidateRequest) returns (PrefixInvalidateResponse);

    // CGC Command binding (PD ↔ Worker instruction interop)
    rpc ExecuteCGCCommand(CGCCommandRequest) returns (CGCCommandResponse);

    // KDA specific operations
    rpc ExecuteKDAForward(KDAForwardRequest) returns (KDAForwardResponse);
    rpc UpdateKDABasis(KDABasisRequest) returns (KDABasisResponse);

    // DOPD session / phase handoff (proto source only; regenerate pb2 on enable)
    rpc PrepareHandoff(HandoffPrepareRequest) returns (HandoffPrepareResponse);
    rpc CommitHandoff(HandoffCommitRequest) returns (HandoffCommitResponse);
    rpc ResumeDecode(ResumeDecodeRequest) returns (ResumeDecodeResponse);
    rpc AbortHandoff(HandoffAbortRequest) returns (HandoffAbortResponse);
    rpc QuerySessionState(SessionQueryRequest) returns (SessionQueryResponse);

    // Distributed health check
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ============================================================================
// Block Allocation
// ============================================================================
message BlockRequest {
    repeated int64 sequence_ids = 1;
    int32 num_blocks = 2;
    string model_name = 3;
}

message BlockResponse {
    repeated int32 block_ids = 1;
    bool success = 2;
    string error_message = 3;
}

// ============================================================================
// Prefix KV Cache
// ============================================================================
message PrefixKVRequest {
    string key = 1;
    bytes kv_data = 2;
    int32 ttl_seconds = 3;
    map<string, string> metadata = 4;
}

message PrefixKVResponse {
    bool success = 1;
    string error_message = 2;
}

message PrefixRequest {
    string key = 1;
    bool use_cache = 2;
}

message PrefixResponse {
    bytes kv_data = 1;
    bool cache_hit = 2;
}

message PrefixInvalidateRequest {
    string key = 1;
}

message PrefixInvalidateResponse {
    bool success = 1;
}

// ============================================================================
// CGC Command Binding (Core: PD ↔ Worker)
// ============================================================================
message CGCCommandRequest {
    int32 opcode = 1;
    bytes payload = 2;
    map<string, bytes> tensors = 3;
    string command_name = 4;
    map<string, string> params = 5;
}

message CGCCommandResponse {
    bytes output = 1;
    bool success = 2;
    string error_message = 3;
    int64 execution_time_us = 4;
}

// ============================================================================
// KDA Operations (PD Layer Preprocessing)
// ============================================================================
message KDAForwardRequest {
    bytes q_data = 1;
    bytes k_data = 2;
    bytes v_data = 3;
    float scale = 4;
    bytes g_data = 5;
    bytes beta_data = 6;
    bytes A_log_data = 7;
    bytes dt_bias_data = 8;
    float lower_bound = 9;
    bool use_flashkda = 10;
}

message KDAForwardResponse {
    bytes output_data = 1;
    bytes final_state_data = 2;
    bool success = 3;
    int64 kernel_time_us = 4;
}

message KDABasisRequest {
    bytes proj_kv_data = 1;
    bytes global_basis_data = 2;
    float decay = 3;
    int32 gram_schmidt_iter = 4;
}

message KDABasisResponse {
    bytes updated_basis_data = 1;
    bool success = 2;
}

// ============================================================================
// DOPD Session / Resume Contract
// ============================================================================
message HandoffPrepareRequest {
    string session_id = 1;
    string handoff_id = 2;
    string source_role = 3;
    string target_role = 4;
    string phase_role = 5;
    string model_name = 6;
    string cache_schema = 7;
    string kv_variant = 8;
    string transport_codec = 9;
    string compression_codec = 10;
    bool zero_copy_vram = 11;
    bytes resume_payload = 12;
    map<string, string> metadata = 13;
}

message HandoffPrepareResponse {
    bool success = 1;
    string handoff_id = 2;
    string session_id = 3;
    string ack_status = 4;
    string error_message = 5;
}

message HandoffCommitRequest {
    string session_id = 1;
    string handoff_id = 2;
    string target_worker = 3;
    int64 resume_position = 4;
    bytes resume_payload = 5;
    map<string, string> metadata = 6;
}

message HandoffCommitResponse {
    bool success = 1;
    string ack_status = 2;
    string resume_token = 3;
    string error_message = 4;
}

message ResumeDecodeRequest {
    string session_id = 1;
    string handoff_id = 2;
    string resume_token = 3;
    string worker_id = 4;
    int64 max_new_tokens = 5;
    bytes resume_payload = 6;
    map<string, string> metadata = 7;
}

message ResumeDecodeResponse {
    bool success = 1;
    string ack_status = 2;
    string worker_id = 3;
    string error_message = 4;
    int64 accepted_at_us = 5;
}

message HandoffAbortRequest {
    string session_id = 1;
    string handoff_id = 2;
    string rollback_reason = 3;
}

message HandoffAbortResponse {
    bool success = 1;
    string ack_status = 2;
    string error_message = 3;
}

message SessionQueryRequest {
    string session_id = 1;
    string handoff_id = 2;
}

message SessionQueryResponse {
    bool success = 1;
    string session_id = 2;
    string handoff_id = 3;
    string phase_role = 4;
    string session_status = 5;
    string active_worker = 6;
    map<string, string> metadata = 7;
}

// ============================================================================
// Health Check
// ============================================================================
message HealthCheckRequest {
    string client_id = 1;
}

message HealthCheckResponse {
    bool healthy = 1;
    string status = 2;
    int32 active_connections = 3;
    map<string, int32> cache_stats = 4;
}
