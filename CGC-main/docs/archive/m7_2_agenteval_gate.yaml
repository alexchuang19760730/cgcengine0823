suite:
  id: cgc_m7_2_gate
  name: CGC M7.2 Gate
  version: 1

runs:
  - id: cgc_m7_2_cli
    name: CGC pipeline (CLI)
    command:
      - python3
      - cgc_engine/agent/cli.py
      - pipeline
      - --mode
      - edge-cloud
      - --milestone
      - m7
      - --output-dir
      - ./_agenteval_runs/m7_2_cli
    artifacts:
      report_json: ./_agenteval_runs/m7_2_cli/report.json

  - id: cgc_m7_2_py
    name: CGC gate (Python API)
    command:
      - python3
      - -c
      - "from cgc_engine.product import run_m7_gate; import json; r=run_m7_gate(output_dir='./_agenteval_runs/m7_2_py'); print(json.dumps(r, ensure_ascii=False))"
    artifacts:
      report_json: ./_agenteval_runs/m7_2_py/m7_industrial/m7_report.json

gates:
  - id: m7_2_overall
    name: M7.2 Overall
    report_from: cgc_m7_2_cli
    checks:
      - json_path: gate_result.m7.status
        equals: PASS

  - id: m7_2_dynamic_trace
    name: Dynamic Trace (L1)
    report_from: cgc_m7_2_cli
    checks:
      - json_path: gate_result.m7.dynamic_trace.status
        equals: PASS
      - json_path: gate_result.m7.dynamic_trace.level
        equals: L1
      - json_path: gate_result.m7.dynamic_trace.compile_variants
        min_len: 3
      - json_path: gate_result.m7.dynamic_trace.correctness.0.repeat_consistent
        equals: true

  - id: m7_2_state_compression
    name: Full-State Compression
    report_from: cgc_m7_2_cli
    checks:
      - json_path: gate_result.m7.state_compression.status
        equals: PASS
      - json_path: gate_result.m7.state_compression.ratio
        lte: 0.6
      - json_path: gate_result.m7.state_compression.restore_ok
        equals: true
      - json_path: gate_result.m7.state_compression.dedup.bytes_added
        equals: 0

  - id: m7_2_replay
    name: Replay (Soft-RT)
    report_from: cgc_m7_2_cli
    checks:
      - json_path: gate_result.m7.replay.status
        equals: PASS
      - json_path: gate_result.m7.replay.mode
        equals: soft_rt
      - json_path: gate_result.m7.replay.deadline_ms
        equals: 10.0
      - json_path: gate_result.m7.replay.latency_ms.p99
        lte: 10.0
      - json_path: gate_result.m7.replay.latency_ms.p999
        lte: 15.0
      - json_path: gate_result.m7.replay.miss_rate
        lte: 0.001

  - id: m7_2_audit
    name: Audit Hash Chain
    report_from: cgc_m7_2_cli
    checks:
      - json_path: gate_result.m7.audit.status
        equals: PASS
      - json_path: gate_result.m7.audit.verify_ok
        equals: true
